<!DOCTYPE html>
<html>

<head>

    <title>Forca</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div class="container">

        </svg>
        <div class="palavra-certa">

        </div>
    </div>
    <div class="teclado">
        <div class="linha"></div>
        <div class="linha"></div>
        <div class="linha"></div>
    </div>
    <div class="painel-fim" id="painel">
        <h3>Mensagem</h3>
        <p id="tentativas">Tentativas: 0</p>
        <p id="palavra-certa">Palavra certa: </p>
    </div>
    <div class="shadow" id="shadow"></div>
    <script src="assets/script.js"></script>
</body>

</html>
